[package]
name = "h264bsd"
version = "0.2.2"
edition = "2021"
authors = ["0skar16"]
description = "Bindings for h264bsd decoder"
readme = "README.md"
license = "MIT"
homepage = "https://github.com/0skar16/h264bsd-rs"
repository = "https://github.com/0skar16/h264bsd-rs"
keywords = ["video", "multimedia","decoding", "h264", "decoder"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
av-codec = "0.3"
av-data = "0.4"
h264bsd-sys = "1.0.0"

[dev-dependencies]
image = "0.25"

[workspace]

members = [
    "h264bsd-sys",
]
